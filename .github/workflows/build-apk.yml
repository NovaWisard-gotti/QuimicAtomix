name: Build QuimicAtomix APK

# Se ejecuta automáticamente al hacer push. También puede lanzarse manualmente.
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK de depuración
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Limpiar
        run: ./gradlew clean --no-daemon

      - name: Ejecutar tests unitarios
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Publicar resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Ejecutar lint
        run: ./gradlew lintDebug --no-daemon

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --no-daemon

      - name: Calcular SHA-256 del APK
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.sha256.txt

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: QuimicAtomix-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.sha256.txt
